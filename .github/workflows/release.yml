name: Signed release

# Manual only. Signing secrets are never available to pull-request builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release   # protect with required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.OMNICHAT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OMNICHAT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNICHAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OMNICHAT_KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/sign"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/sign/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/sign/keystore.properties"
          echo "OMNICHAT_KEYSTORE_PROPERTIES=$RUNNER_TEMP/sign/keystore.properties" >> "$GITHUB_ENV"
      - name: Test, lint and build signed release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/sign"
      - uses: actions/upload-artifact@v4
        with:
          name: omnichat-release
          path: app/build/outputs/apk/release/*.apk
